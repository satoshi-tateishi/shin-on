name: Deploy to Home Server

on:
  push:
    branches:
      - release  # releaseブランチへのpushでトリガー

jobs:
  # -----------------------------------------------
  # コードスタイルチェック (Laravel Pint)
  # -----------------------------------------------
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, gd
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint
        run: ./vendor/bin/pint --test

  # -----------------------------------------------
  # テスト実行 (PHPUnit)
  # -----------------------------------------------
  test:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, gd, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test

  # -----------------------------------------------
  # デプロイ (CI成功後のみ実行)
  # -----------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test]  # lint と test が成功した場合のみ実行
    # 特定のリポジトリでのみ実行
    if: github.repository == 'satoshi-tateishi/shin-on'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 56834
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # パーミッション修正（git resetのため一時的に所有権を変更）
            sudo chown -R $USER:$USER ${{ secrets.DEPLOY_PATH }}

            # 最新のコードを取得（デプロイキーを使用）
            GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519_deploy_shinon -o StrictHostKeyChecking=no' git fetch origin
            git reset --hard origin/release

            # storage, bootstrap/cache, vendor の所有者をwww-data(33)に設定
            sudo chown -R 33:33 ${{ secrets.DEPLOY_PATH }}/storage ${{ secrets.DEPLOY_PATH }}/bootstrap/cache ${{ secrets.DEPLOY_PATH }}/vendor

            # Dockerイメージを再ビルドしてコンテナを再起動（Dockerfile変更時に必要）
            docker compose -f docker-compose.production.yml build app
            docker compose -f docker-compose.production.yml up -d app

            # 依存関係の更新（新しいコンテナ内で実行）
            docker compose -f docker-compose.production.yml exec -T app composer install --no-dev --optimize-autoloader

            # NPM依存関係とアセットビルド（ホスト側で実行）
            npm ci
            rm -f public/hot
            npm run build

            # データベースマイグレーション
            docker compose -f docker-compose.production.yml exec -T app php artisan migrate --force

            # キャッシュクリア
            docker compose -f docker-compose.production.yml exec -T app php artisan config:clear
            docker compose -f docker-compose.production.yml exec -T app php artisan cache:clear
            docker compose -f docker-compose.production.yml exec -T app php artisan route:clear
            docker compose -f docker-compose.production.yml exec -T app php artisan view:clear

            # キャッシュ最適化
            docker compose -f docker-compose.production.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.production.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.production.yml exec -T app php artisan view:cache

            # OPcacheをクリアするためにPHP-FPMを再起動
            docker compose -f docker-compose.production.yml restart app

            echo "Deployment completed successfully!"
